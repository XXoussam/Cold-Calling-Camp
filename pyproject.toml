[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immoops-coldcaller"
version = "0.1.0"
description = "Outbound AI cold-calling agent for the ImmoOps AI campaign"
requires-python = ">=3.10, <3.14"

dependencies = [
    "livekit-agents[elevenlabs,deepgram,openai,silero,turn-detector]~=1.3",
    "livekit-plugins-noise-cancellation~=0.2",
    "python-dotenv",
    "tzdata; sys_platform == 'win32'",
    "twilio",
    "httpx",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]
